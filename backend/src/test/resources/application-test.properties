spring.application.name=backend-test

spring.datasource.url=jdbc:h2:mem:cueillette_test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
# H2 reserves "day"; quote identifiers so picking_days.day works in integration tests
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.flyway.enabled=false

DB_USERNAME=sa
DB_PASSWORD=

jwt.secret=test-jwt-secret-must-be-at-least-32-bytes-long
jwt.expiration=86400000

resend.api-key=test-resend-key-not-used-in-web-tests
resend.from=test@example.com
resend.admin-email=admin@example.com

app.api.expose-internal-errors=true
