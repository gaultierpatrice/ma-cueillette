spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5432/cueillette_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.flyway.locations=classpath:db/migration

spring.flyway.enabled=true
spring.flyway.url=jdbc:postgresql://localhost:5432/cueillette_db
spring.flyway.user=${DB_USERNAME}
spring.flyway.password=${DB_PASSWORD}

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

resend.api-key=${RESEND_API_KEY}
resend.from=${RESEND_FROM:Ma Cueillette <onboarding@resend.dev>}
resend.admin-email=${RESEND_ADMIN_EMAIL:gaultiercode@gmail.com}