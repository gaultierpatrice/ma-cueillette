spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5432/cueillette_db
spring.datasource.username=postgres
spring.datasource.password=pgpicking
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.flyway.locations=classpath:db/migration

jwt.secret=your-super-secret-key-change-this-in-production-must-be-long
jwt.expiration=86400000

spring.flyway.enabled=true
spring.flyway.url=jdbc:postgresql://localhost:5432/cueillette_db
spring.flyway.user=postgres
spring.flyway.password=pgpicking

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0