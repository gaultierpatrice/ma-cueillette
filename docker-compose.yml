services:
  # PostgreSQL Database
  db:
    image: docker.io/library/postgres:17-alpine
    container_name: cueillette-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME:-cueillette_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me}
    # No host ports in production — reachable only as `db:5432` on the Docker network.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cueillette-network

  # Spring Boot Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cueillette-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME:-cueillette_db}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-change_me}
      SPRING_FLYWAY_URL: jdbc:postgresql://db:5432/${DB_NAME:-cueillette_db}
      SPRING_FLYWAY_USER: ${DB_USERNAME:-postgres}
      SPRING_FLYWAY_PASSWORD: ${DB_PASSWORD:-change_me}
      SPRING_PROFILES_ACTIVE: prod
      SPRING_FLYWAY_ENABLED: true
      APP_UPLOAD_PICKING_IMAGES_DIR: /app/uploads/pickings
    volumes:
      - picking_uploads:/app/uploads
    # No host ports: API is only reachable via the frontend/nginx proxy on the Docker network.
    # For local direct access, use docker-compose.dev.yml (127.0.0.1 only).
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cueillette-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Angular Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cueillette-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - cueillette-network

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
  picking_uploads:
    driver: local

networks:
  cueillette-network:
    driver: bridge
