# Included in the http {} block (conf.d/*.conf). Zones must be defined before use in server blocks.

limit_req_zone $binary_remote_addr zone=api_read:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_contact:10m rate=5r/m;

limit_req_status 429;
