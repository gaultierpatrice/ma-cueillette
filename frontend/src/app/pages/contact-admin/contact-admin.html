<section class="hero">
  <div class="container">
    <div class="card">
      <h1>Contacter l'administrateur</h1>
      <p class="lead">
        Posez votre question ou signalez un problème. Vous recevrez une réponse à l'adresse e-mail indiquée.
      </p>

      <form (ngSubmit)="onSubmit()" #f="ngForm">
        <div class="form-group">
          <label for="contact-name">Nom</label>
          <input
            id="contact-name"
            name="name"
            type="text"
            [(ngModel)]="form.name"
            required
            maxlength="120"
            autocomplete="name"
            [disabled]="submitting"
          />
        </div>

        <div class="form-group">
          <label for="contact-email">E-mail</label>
          <input
            id="contact-email"
            name="email"
            type="email"
            [(ngModel)]="form.email"
            required
            maxlength="254"
            autocomplete="email"
            [disabled]="submitting"
          />
        </div>

        <div class="form-group">
          <label for="contact-message">Message</label>
          <textarea
            id="contact-message"
            name="message"
            [(ngModel)]="form.message"
            required
            maxlength="8000"
            [disabled]="submitting"
          ></textarea>
        </div>

        <div class="form-actions">
          <button type="submit" [disabled]="submitting || !f.valid">
            {{ submitting ? 'Envoi en cours…' : 'Envoyer' }}
          </button>
        </div>

        <p class="msg success" *ngIf="sent">Message envoyé. Merci&nbsp;!</p>
        <p class="msg error" *ngIf="errorMessage">{{ errorMessage }}</p>
      </form>

      <a routerLink="/" class="back-link">Retour à l'accueil</a>
    </div>
  </div>
</section>
