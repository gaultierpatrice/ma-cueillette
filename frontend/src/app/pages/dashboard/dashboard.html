<section class="hero">
  <div class="hero-card">
    <div class="container" style="background: transparent; padding: 0; max-width: 520px;">
      @if (isAuthenticated) {
        <div class="authenticated-view">
          <h2>Welcome {{ username }}!</h2>
          <p>You are successfully logged in.</p>
          <button class="btn-logout" (click)="logout()">Log out</button>
        </div>
      } @else {
        <div class="non-authenticated-view">
          <h2>Welcome to Our App!</h2>
          <p>Please log in or create an account to continue.</p>

          <div class="action-buttons">
            <button class="btn-login" (click)="navigateToLogin()">Log In</button>
            <button class="btn-register" (click)="navigateToRegister()">Register</button>
          </div>
        </div>
      }
      <div>
        <a routerLink="/favorites">Mes favoris</a>
      </div>
      <a routerLink="/pickings">Liste des cueillettes</a>
      <div><a routerLink="/add-picking">Proposer ma cueillette</a></div>
      <div><a routerLink="/delete-account">Supprimer mon compte</a></div>
      <a routerLink="/contact-admin">Contact admin</a>
    </div>
  </div>
</section>
