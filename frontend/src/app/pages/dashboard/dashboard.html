<section class="hero">
  <div class="hero-card">
    <div class="container" style="background: transparent; padding: 0; max-width: 520px">
      @if (isAuthenticated) {
        <div class="authenticated-view">
          <h2>Bienvenue {{ username }} !</h2>
          <p>Vous êtes connecte avec succes.</p>
          <button class="btn-logout" (click)="logout()">Se deconnecter</button>
        </div>
      } @else {
        <div class="non-authenticated-view">
          <h2>Bienvenue sur notre application !</h2>
          <p>Veuillez vous connecter ou créer un compte pour continuer.</p>
          <div class="action-buttons">
            <button class="btn-login" (click)="navigateToLogin()">Se connecter</button>
            <button class="btn-register" (click)="navigateToRegister()">S'inscrire</button>
          </div>
        </div>
      }
      <div>
        <a routerLink="/favorites">Mes favoris</a>
      </div>
      <a routerLink="/pickings">Liste des cueillettes</a>
      <div><a routerLink="/add-picking">Proposer ma cueillette</a></div>
      <div><a routerLink="/delete-account">Supprimer mon compte</a></div>
      <a routerLink="/contact-admin">Contacter l'administrateur</a>
    </div>
  </div>
</section>
