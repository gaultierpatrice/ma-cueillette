<section class="hero">
  <div class="container">
    <h2>Creer un compte</h2>
    <form #registerForm="ngForm" (ngSubmit)="onSubmit(registerForm)">
      <div class="field">
        <label>Type de compte</label>
        <select [(ngModel)]="form.role" name="role" required>
          <option value="USER">Utilisateur</option>
          <option value="PRODUCER">Producteur</option>
        </select>
      </div>
      <div class="field">
        <label>Nom</label>
        <input type="text" [(ngModel)]="form.name" name="name" required />
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" [(ngModel)]="form.email" name="email" autocomplete="email" required />
      </div>
      <div class="field">
        <label>Mot de Passe</label>
        <input type="password" [(ngModel)]="form.password" name="password" autocomplete="new-password" required />
      </div>
      @if (form.role === 'PRODUCER') {
        <div class="field">
          <label>Nom de l'exploitation</label>
          <input type="text" [(ngModel)]="form.farmName" name="farmName" required />
        </div>
      }
      <button type="submit">Creer mon compte</button>
    </form>
    <p><a routerLink="/login">Vous avez déjà un compte? Se connecter</a></p>
  </div>
</section>

<app-modal
  [visible]="isSuccessModalVisible()"
  title="Compte créé"
  message="Votre compte a bien été créé. Que souhaitez-vous faire ?"
  [closeOnOverlay]="false"
  [splitButtons]="true"
  [buttons]="registerSuccessButtons"
  (buttonClick)="onRegisterSuccessButton($event)"
/>

<app-modal
  [visible]="isErrorModalVisible()"
  title="Erreur d'inscription"
  [message]="errorMessage()"
  (closed)="hideErrorModal()"
  (buttonClick)="hideErrorModal()"
/>
