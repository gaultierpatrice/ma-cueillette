<section class="hero">
  <div class="container">
    <h2>Creer un compte</h2>
    <form #registerForm="ngForm" (ngSubmit)="onSubmit(registerForm)">
      <div class="field">
        <label>
          Type de compte
          <select [(ngModel)]="form.role" name="role" required>
            <option value="USER">Utilisateur</option>
            <option value="PRODUCER">Producteur</option>
          </select>
        </label>
      </div>
      <div class="field">
        <label for="register-name">Nom</label>
        <input
          id="register-name"
          type="text"
          [(ngModel)]="form.name"
          name="name"
          autocomplete="name"
          required
        />
      </div>
      <div class="field">
        <label for="register-email">Email</label>
        <input
          id="register-email"
          type="email"
          [(ngModel)]="form.email"
          name="email"
          autocomplete="email"
          required
        />
      </div>
      <div class="field">
        <label for="register-password">Mot de Passe</label>
        <input
          id="register-password"
          type="password"
          [(ngModel)]="form.password"
          name="password"
          autocomplete="new-password"
          required
        />
      </div>
      @if (form.role === 'PRODUCER') {
        <div class="field">
          <label for="register-farm-name">Nom de l'exploitation</label>
          <input
            id="register-farm-name"
            type="text"
            [(ngModel)]="form.farmName"
            name="farmName"
            autocomplete="organization"
            required
          />
        </div>
      }
      <button type="submit">Creer mon compte</button>
    </form>
    <p><a routerLink="/login">Vous avez déjà un compte? Se connecter</a></p>
  </div>
</section>

<app-modal
  [visible]="isSuccessModalVisible()"
  title="Compte créé"
  message="Votre compte a bien été créé. Que souhaitez-vous faire ?"
  [closeOnOverlay]="false"
  [splitButtons]="true"
  [buttons]="registerSuccessButtons"
  (buttonClick)="onRegisterSuccessButton($event)"
/>

<app-modal
  [visible]="isErrorModalVisible()"
  title="Erreur d'inscription"
  [message]="errorMessage()"
  (closed)="hideErrorModal()"
  (buttonClick)="hideErrorModal()"
/>
