<section class="hero">
  <div class="container">
    <h2>Creer un compte</h2>
    <form #registerForm="ngForm" (ngSubmit)="onSubmit(registerForm)">
      <div class="field">
        <label>Type de compte</label>
        <select [(ngModel)]="form.role" name="role" required>
          <option value="USER">Utilisateur</option>
          <option value="PRODUCER">Producteur</option>
        </select>
      </div>
      <div class="field">
        <label>Nom</label>
        <input type="text" [(ngModel)]="form.name" name="name" required />
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" [(ngModel)]="form.email" name="email" autocomplete="email" required />
      </div>
      <div class="field">
        <label>Mot de Passe</label>
        <input type="password" [(ngModel)]="form.password" name="password" autocomplete="new-password" required />
      </div>
      @if (form.role === 'PRODUCER') {
        <div class="field">
          <label>Nom de l'exploitation</label>
          <input type="text" [(ngModel)]="form.farmName" name="farmName" required />
        </div>
      }
      <button type="submit">Creer mon compte</button>
    </form>
    <p><a routerLink="/login">Vous avez déjà un compte? Se connecter</a></p>
  </div>
</section>

@if (isSuccessModalVisible()) {
  <div class="modal-overlay modal-overlay--blocking">
    <div class="modal-content" (click)="$event.stopPropagation()">
      <h3>Compte créé</h3>
      <p>Votre compte a bien été créé. Que souhaitez-vous faire&nbsp;?</p>
      <div class="modal-buttons modal-buttons--split">
        <button type="button" class="btn-secondary" (click)="goToLandingAfterRegister()">
          Page d'accueil
        </button>
        <button type="button" class="btn-confirm" (click)="goToLoginAfterRegister()">Se connecter</button>
      </div>
    </div>
  </div>
}

@if (isErrorModalVisible()) {
  <div class="modal-overlay" (click)="hideErrorModal()">
    <div class="modal-content" (click)="$event.stopPropagation()">
      <h3>Erreur d'inscription</h3>
      <p>{{ errorMessage() }}</p>
      <div class="modal-buttons">
        <button class="btn-confirm" (click)="hideErrorModal()">OK</button>
      </div>
    </div>
  </div>
}
