@if (visible) {
  <div
    class="modal-overlay"
    [class.modal-overlay--blocking]="!closeOnOverlay"
    (click)="onOverlayClick()"
  >
    <div class="modal-content" (click)="$event.stopPropagation()">
      <h3>{{ title }}</h3>
      <p>{{ message }}</p>
      <div class="modal-buttons" [class.modal-buttons--split]="splitButtons">
        @for (button of buttons; track $index) {
          <button
            type="button"
            [class]="buttonClass(button.variant)"
            (click)="onButtonClick($index)"
          >
            {{ button.label }}
          </button>
        }
      </div>
    </div>
  </div>
}
