server {

    listen 80;

    server_name localhost;

    root /usr/share/nginx/html;

    index index.html;



    # Gzip compression

    gzip on;

    gzip_vary on;

    gzip_min_length 1024;

    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;



    # Security headers

    add_header X-Frame-Options "SAMEORIGIN" always;

    add_header X-Content-Type-Options "nosniff" always;

    add_header X-XSS-Protection "1; mode=block" always;



    # Stricter limits on abuse-prone public endpoints

    location = /api/users/login {

        limit_req zone=api_auth burst=5 nodelay;

        proxy_pass http://backend:8080/api/users/login;

        include /etc/nginx/snippets/proxy-api.conf;

    }



    location = /api/users/register {

        limit_req zone=api_auth burst=5 nodelay;

        proxy_pass http://backend:8080/api/users/register;

        include /etc/nginx/snippets/proxy-api.conf;

    }



    location = /api/contact {

        limit_req zone=api_contact burst=3 nodelay;

        proxy_pass http://backend:8080/api/contact;

        include /etc/nginx/snippets/proxy-api.conf;

    }



    # API (Spring Boot) — same origin in the browser; service name from Compose / Podman

    location ^~ /api/ {

        limit_req zone=api_read burst=40 nodelay;

        proxy_pass http://backend:8080/api/;

        include /etc/nginx/snippets/proxy-api.conf;

    }



    # Angular routing - serve index.html for all routes

    location / {

        try_files $uri $uri/ /index.html;

    }



    # Cache static assets

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {

        expires 1y;

        add_header Cache-Control "public, immutable";

    }



    # Health check endpoint

    location /health {

        access_log off;

        return 200 "healthy\n";

        add_header Content-Type text/plain;

    }

}

